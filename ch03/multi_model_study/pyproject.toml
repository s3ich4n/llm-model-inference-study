[project]
name = "multi-model-study"
version = "0.1.0"
description = "ch03 multi model serving study"
requires-python = ">=3.10,<3.13"
dependencies = [
    "setuptools==77.0.3",
    "fastapi==0.115.12",
    "uvicorn==0.24.0",
    "pydantic==2.11.5",
    "python-multipart==0.0.20",
    "transformers==4.52.4",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy==1.26.4",
    "pillow==11.2.1",
    "requests==2.32.3",
    "tritonclient[http]==2.57.0",
    "pytest==8.4.0",
    "pytest-asyncio==1.0.0",
    "httpx==0.27.0",
]

[tool.uv]
package = false
python-preference = "system"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "gpu: CUDA가 있어야 도는 테스트",
    "triton: Triton 서버(:8009)가 떠 있어야 도는 테스트",
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends(...) default-arg pattern
