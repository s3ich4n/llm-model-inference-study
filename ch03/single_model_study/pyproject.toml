[project]
name = "single-model-study"
version = "0.1.0"
description = "ch03 single model serving study"
requires-python = ">=3.10,<3.13"
dependencies = [
    "setuptools==77.0.3",
    "dependency-injector==4.49.1",
    "fastapi==0.115.12",
    "uvicorn==0.24.0",
    "pydantic==2.11.5",
    "transformers==4.52.4",
    "torch==2.7.0",
    "numpy==1.26.4",
    "debugpy==1.8.0",
    "pytest==8.4.0",
    "httpx==0.27.0",
    "pytest-asyncio==1.0.0",
    "vllm==0.9.0.1",
]

[tool.uv]
package = false
python-preference = "system"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends(...) default-arg pattern
