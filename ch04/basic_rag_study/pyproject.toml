[project]
name = "basic-rag-study"
version = "0.1.0"
description = "Basic RAG knowledge agent study"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.3.7",
    "PyPDF2>=3.0.1",
    "numpy>=1.24.3",
    "pandas>=2.1.4",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.2",
    "requests>=2.31.0",
]

[tool.uv]
package = false
python-preference = "system"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]
