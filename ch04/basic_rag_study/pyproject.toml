[project]
name = "basic-rag-study"
version = "0.1.0"
description = "Basic RAG knowledge agent study"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.3.7",
    "numpy>=1.24.3",
    "pandas>=2.1.4",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.2",
    "requests>=2.31.0",
    "dependency-injector==4.49.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
]

[tool.uv]
package = false
python-preference = "system"

[tool.pytest.ini_options]
pythonpath = ["."]
# 기본 실행은 무료 테스트만 돈다. 실제 API를 쓰려면 pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: OpenAI API를 실제로 호출한다. 키와 네트워크가 필요하고 비용이 든다",
]
# assert 없이 True를 반환하는 함수가 통과로 집계되던 일을 막는다
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
# 여러 줄로 늘어놓은 인자와 항목에는 끝에도 콤마를 붙인다.
# def 인자를 한 줄에 하나씩 쓰는 규칙을 지탱하는 절반이다. 트레일링 콤마가
# 있으면 ruff format이 한 줄로 도로 합치지 않는다.
extend-select = ["COM812"]
# 예외를 잡아 로그와 안내 메시지로 바꾸고 계속 진행하는 것이 이 학습용 에이전트의 기본 동작이다
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"debug_agent.py" = ["T100"]  # breakpoint()를 놓는 것이 이 스크립트의 목적
